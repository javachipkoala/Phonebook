<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhoneBook - Contact Management</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                📱 PhoneBook
            </a>

            <span class="navbar-text text-white">
                Contact Management
            </span>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container py-4">

        <!-- Header -->
        <section class="hero-section mb-4">
            <div>
                <h1>My Phonebook</h1>
                <p>
                    Add, manage and quickly search your contacts.
                </p>
            </div>

            <div class="contact-counter">
                <span id="contactCount">0</span>
                <small>Contacts</small>
            </div>
        </section>


        <div class="row g-4">

            <!-- Add Contact Section -->
            <div class="col-lg-4">

                <div class="card app-card">

                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-3" id="formTitle">
                            Add Contact
                        </h4>

                        <form id="contactForm">

                            <!-- Used when editing -->
                            <input type="hidden" id="editIndex">


                            <!-- Name -->
                            <div class="mb-3">

                                <label for="name" class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    placeholder="Enter full name"
                                    required
                                >

                            </div>


                            <!-- Phone -->
                            <div class="mb-3">

                                <label for="phone" class="form-label">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    class="form-control"
                                    placeholder="Enter phone number"
                                    required
                                >

                            </div>


                            <!-- Email -->
                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter email address"
                                >

                            </div>


                            <!-- Address -->
                            <div class="mb-3">

                                <label for="address" class="form-label">
                                    Address
                                </label>

                                <textarea
                                    id="address"
                                    class="form-control"
                                    rows="3"
                                    placeholder="Enter address"
                                ></textarea>

                            </div>


                            <!-- Save Button -->
                            <button
                                type="submit"
                                id="saveBtn"
                                class="btn btn-primary w-100"
                            >
                                Save Contact
                            </button>


                            <!-- Cancel Edit -->
                            <button
                                type="button"
                                id="cancelEdit"
                                class="btn btn-outline-secondary w-100 mt-2 d-none"
                            >
                                Cancel Edit
                            </button>

                        </form>

                    </div>

                </div>

            </div>


            <!-- Contacts Section -->
            <div class="col-lg-8">

                <div class="card app-card">

                    <div class="card-body p-4">

                        <!-- Contact Header -->
                        <div
                            class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-4"
                        >

                            <div>

                                <h4 class="fw-bold mb-1">
                                    Saved Contacts
                                </h4>

                                <p class="text-muted mb-0">
                                    Search and manage your contacts.
                                </p>

                            </div>


                            <!-- Search -->
                            <div class="search-container">

                                <input
                                    type="search"
                                    id="searchInput"
                                    class="form-control"
                                    placeholder="🔍 Search contacts..."
                                >

                            </div>

                        </div>


                        <!-- Contact Cards -->
                        <div
                            id="contactsContainer"
                            class="row g-3"
                        ></div>


                        <!-- Empty State -->
                        <div
                            id="emptyState"
                            class="empty-state"
                        >

                            <div class="empty-icon">
                                ☎
                            </div>

                            <h5>
                                No contacts found
                            </h5>

                            <p class="text-muted mb-0">
                                Add your first contact using the form.
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="text-center py-4">

        <small>
            Phonebook Application • Productivity / Contact Management
        </small>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
